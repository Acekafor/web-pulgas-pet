<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <meta
      name="description"
      content="Catálogo de Pulgas Pet: alimentos, snacks, juguetes, accesorios, antipulgas y artículos de aseo para tu mascota."
    />
    <title>Catálogo · Pulgas Pet</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/componentes.css" />
    <link rel="stylesheet" href="assets/css/paginas.css" />
  </head>
  <body data-pagina="catalogo">
    <div class="top">
      <div id="hdr"></div>
      <div class="wrap">
        <h1>Catálogo</h1>
        <p>
          Elige las unidades que necesitas y arma tu orden. La envías por WhatsApp, recoges y pagas
          en la tienda.
        </p>
      </div>
    </div>

    <main class="sec">
      <div class="wrap">
        <!-- Barra de herramientas: Buscador + Especies + Categorías -->
        <div class="catalogo-toolbar">
          <div class="buscador-box">
            <span class="buscar-icon">🔍</span>
            <input
              id="buscar"
              placeholder="Busca un producto por nombre, marca o categoría…"
              aria-label="Buscar producto"
            />
          </div>

          <!-- Filtro por Especie -->
          <div class="filtros-especies" id="filtros-especie" aria-label="Filtrar por especie">
            <button class="chip-especie on" data-especie="todas">🐾 Todos</button>
            <button class="chip-especie" data-especie="perro">🐶 Perros</button>
            <button class="chip-especie" data-especie="gato">🐱 Gatos</button>
          </div>

          <!-- Filtro por Categorías -->
          <div class="filtros" id="filtros-cat" aria-label="Filtrar por categoría"></div>
        </div>

        <!-- Productos renderizados -->
        <div class="grid" id="catalogo">
          <p class="vacio">Cargando catálogo...</p>
        </div>
      </div>
    </main>

    <div id="ftr"></div>
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
