name: Integración Continua (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  calidad-codigo:
    name: Verificación de Calidad, Formato y Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter (ESLint)
        run: npm run lint

      - name: Verificar Formato (Prettier)
        run: npm run format:check

      - name: Ejecutar Pruebas Unitarias
        run: npm run test:unit

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      - name: Ejecutar Pruebas E2E (Playwright)
        run: npm run test:e2e